<!DOCTYPE html>
<html lang="es">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girasol Animado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <style>body {
    margin: 0;
    padding: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    background: linear-gradient(to top, #a1d4f5 0%, #d5eaf5 60%, #ffffff 100%);
    overflow: hidden;
    font-family: 'Playfair Display', serif;

    transition: background 1s ease;
}

body.night-mode {
    background: linear-gradient(to top, #020111 0%, #19163a 70%);
}

#stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    background-image:
            radial-gradient(white, rgba(255,255,255,0.2) 2px, transparent 40px),
            radial-gradient(white, rgba(255,255,255,0.15) 1px, transparent 30px),
            radial-gradient(white, rgba(255,255,255,0.1) 2px, transparent 40px),
            radial-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.1) 2px, transparent 30px);
    background-size: 550px 550px, 350px 350px, 250px 250px, 150px 150px;
    background-position: 0 0, 40px 60px, 130px 270px, 70px 100px;
    opacity: 0;
    transition: opacity 1.5s ease;
    z-index: -1;
}

body.night-mode #stars {
    opacity: 1;
}

body.night-mode .floating-phrase {
    color: #e0e0e0;
    text-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
}

#night-mode-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 10px 15px;
    border-radius: 20px;
    border: 1px solid rgba(0, 0, 0, 0.2);
    background-color: rgba(255, 255, 255, 0.5);
    cursor: pointer;
    font-family: sans-serif;
    font-size: 14px;
    z-index: 100;
    transition: all 0.3s ease;
}

#night-mode-toggle:hover {
    background-color: rgba(255, 255, 255, 0.8);
    transform: scale(1.05);
}

body.night-mode #night-mode-toggle {
    background-color: rgba(0, 0, 0, 0.3);
    border-color: rgba(255, 255, 255, 0.3);
    color: white;
}

.sunflower-container {
    position: relative;
    bottom: -50px;
    animation: sway 12s ease-in-out infinite;
    transform-origin: bottom center;
}
@media (hover: hover) {
    .sunflower-container:hover {
        animation-play-state: paused;
    }
}

.stem {
    width: 15px;
    height: 400px;
    background: linear-gradient(to right, #4a7d29, #6a9c40);
    border-radius: 10px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: 0;
}

.leaf {
    position: absolute;
    background: linear-gradient(to bottom right, #5a8c39, #8bc34a);
    border-radius: 50% 0 50% 50%;
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
}

.leaf.leaf-1 {
    width: 80px;
    height: 100px;
    bottom: 200px;
    left: 30px;
    transform: rotate(10deg);
}

.leaf.leaf-2 {
    width: 70px;
    height: 90px;
    bottom: 120px;
    left: 135px;
    transform: rotate(-10deg) scaleX(-1);
}


.head {
    width: 250px;
    height: 250px;
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    bottom: 380px;
}


.center {
    width: 120px;
    height: 120px;
    background: radial-gradient(ellipse at center, #6b4a2f 0%, #4a301a 100%);
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    box-shadow: inset 0 0 15px #2a1a0a;
}


.center::before {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background-image:
            radial-gradient(#9d785a 15%, transparent 16%),
            radial-gradient(#9d785a 15%, transparent 16%);
    background-size: 10px 10px;
    background-position: 0 0, 5px 5px;
    opacity: 0.3;
}


.petal {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: bottom center;
    box-shadow: inset 0 -5px 10px rgba(0,0,0,0.15);
    border: 1px solid #ffc800;
}


.petal-back {
    width: 60px;
    height: 140px;
    background: linear-gradient(to top, #e6b800, #ffd700);
    border-radius: 50% 50% 0 0;
    z-index: 1;
}

.petal-middle {
    width: 50px;
    height: 120px;
    background: linear-gradient(to top, #ffcc00, #ffea80);
    border-radius: 50% 50% 0 0;
    z-index: 2;
}

.petal-front {
    width: 40px;
    height: 100px;
    background: linear-gradient(to top, #ffd700, #fff2b2);
    border-radius: 50% 50% 0 0;
    z-index: 3;
}

.petal.clickable {
    cursor: pointer;
    transition: filter 0.2s ease-in-out;
}

.petal.clickable:hover {
    filter: brightness(1.1);
}

.floating-phrase {
    position: absolute;
    color: #911708;
    font-size: 22px;
    font-style: italic;
    white-space: nowrap;
    user-select: none;
    pointer-events: none;
    animation: floatUp 3s ease-out forwards;
    transition: color 1s ease;
}

.petal.falling {
    animation: fallAndFade 2.5s ease-in forwards;
    pointer-events: none;
}

@keyframes floatUp {
    0% {
        transform: translate(-50%, -50%) translateY(0);
        opacity: 1;
    }
    100% {
        transform: translate(-50%, -50%) translateY(-150px);
        opacity: 0;
    }
}

@keyframes fallAndFade {
    0% {
        transform-origin: bottom center;
    }
    100% {
        transform: translateY(80vh) rotate(var(--original-rotate, 0deg)) rotateZ(180deg);
        opacity: 0;
    }
}


@keyframes sway {
    0%, 100% {
        transform: rotate(3deg);
    }
    50% {
        transform: rotate(-3deg);
    }
}
#particle-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;

    /* --- Responsive para móviles --- */
@media (max-width: 768px) {
    .sunflower-container {
        transform: scale(1.4); /* agranda más el girasol */
        bottom: -5vh;
    }

    .head {
        width: 45vw;   /* más grande para que se vean los pétalos */
        height: 45vw;
        bottom: 35vh;
    }

    .center {
        width: 20vw;
        height: 20vw;
    }

    .stem {
        width: 3vw;
        height: 50vh;
    }

    .leaf.leaf-1 {
        width: 15vw;
        height: 20vw;
        bottom: 22vh;
        left: 8vw;
    }

    .leaf.leaf-2 {
        width: 14vw;
        height: 18vw;
        bottom: 14vh;
        left: 22vw;
    }

    .floating-phrase {
        font-size: 7vw; /* letras más grandes en móvil */
        color: #ffffff;
        -webkit-text-stroke: 2.5px black; /* borde negro más grueso */
        text-shadow: 3px 3px 8px rgba(0,0,0,0.9);
    }

    #night-mode-toggle {
        font-size: 5vw; /* botón más grande */
        padding: 3vw 4vw;
    }
}

}</style>
</head>
<body>

<button id="night-mode-toggle">Modo Noche 🌙</button>

<div id="stars"></div>

<div class="sunflower-container">
    <div class="head">
        <div class="center">
            <canvas id="particle-canvas"></canvas>
        </div>
    </div>
    <div class="stem"></div>
    <div class="leaf leaf-1"></div>
    <div class="leaf leaf-2"></div>
</div>

<script type="module">const phrases = [
    "Eres mi girasol",
    "Contigo todo es mejor",
    "Mi lugar favorito son tus abrazos",
    "Gracias por ser mi niña",
    "Te amo con mi corazoncito",
    "Eres mi sueño ideal",
    "Te amo, futura esposa",
    "Eres mi sueño hecho realidad",
    "A tu lado, soy más fuerte",
    "Ta amo hoy, mañana y siempre",
    "Eres mi pequeña princesa",
    "Eres mi preciado atardecer"
];

let phraseIndex = 0;

function detachPetal(event) {
    const petal = event.currentTarget;
    if (petal.classList.contains('falling')) return;

    const computedStyle = window.getComputedStyle(petal);
    petal.style.setProperty('--original-rotate', computedStyle.transform);
    petal.classList.add('falling');

    const phrase = document.createElement('div');
    phrase.classList.add('floating-phrase');
    phrase.textContent = phrases[phraseIndex % phrases.length];
    phraseIndex++;
    phrase.style.left = `${event.clientX}px`;
    phrase.style.top = `${event.clientY}px`;
    document.body.appendChild(phrase);

    petal.addEventListener('animationend', () => petal.remove());
    phrase.addEventListener('animationend', () => phrase.remove());
}

function createPetals() {
    const head = document.querySelector('.head');
    const layers = [
        { count: 16, className: 'petal-back', offset: 0 },
        { count: 16, className: 'petal-middle', offset: 11.25 },
        { count: 12, className: 'petal-front', offset: 15 }
    ];
    layers.forEach(layer => {
        for (let i = 0; i < layer.count; i++) {
            const petal = document.createElement('div');
            petal.classList.add('petal', layer.className);
            const angle = (360 / layer.count) * i + layer.offset;
            petal.style.transform = `translate(-50%, -100%) rotate(${angle}deg)`;
            if (layer.className === 'petal-front') {
                petal.classList.add('clickable');
                petal.addEventListener('click', detachPetal);
            }
            head.appendChild(petal);
        }
    });
}

const canvas = document.getElementById('particle-canvas');
const ctx = canvas.getContext('2d');

const centerDiv = document.querySelector('.center');
canvas.width = centerDiv.clientWidth;
canvas.height = centerDiv.clientHeight;

let particlesArray = [];

class Particle {
    constructor() {
        this.x = canvas.width / 2;
        this.y = canvas.height / 2;
        this.vx = (Math.random() - 0.5) * 1.5;
        this.vy = (Math.random() - 0.5) * 1.5;
        this.size = Math.random() * 3 + 1;
        this.life = 100;
        this.maxLife = 100;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 1;
    }

    draw() {
        ctx.beginPath();
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = '#ffd700';
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.closePath();
    }
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
    }
    particlesArray = particlesArray.filter(p => p.life > 0);
    ctx.globalAlpha = 1;
    requestAnimationFrame(animate);
}

window.onload = () => {
    createPetals();

    setInterval(() => {
        for (let i = 0; i < 3; i++) {
            particlesArray.push(new Particle());
        }
    }, 300);

    animate();

    const nightModeToggle = document.getElementById('night-mode-toggle');
    nightModeToggle.addEventListener('click', () => {

        document.body.classList.toggle('night-mode');

        if (document.body.classList.contains('night-mode')) {
            nightModeToggle.textContent = 'Modo Día ☀️';
        } else {
            nightModeToggle.textContent = 'Modo Noche 🌙';
        }
    });
};</script>
<!-- Reproductor de audio -->
<audio id="bg-music" src="Perfect (spanish version) - Kevin & Karla - Kevin&Karla.mp3" preload="auto"></audio>

<!-- Tu script externo -->
<script src="script.js"></script>
</body>
</html>
